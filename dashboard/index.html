<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch Radar: pre-token protocols ranked by implied launch value</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="masthead">
  <div class="ring" aria-hidden="true"><span></span></div>
  <div class="masthead-text">
    <h1>Launch Radar</h1>
    <p class="tagline">Protocols that record no token yet, ranked by what their launch would be worth &mdash; and how to farm each one before it happens.</p>
    <p class="meta" id="meta">Loading the board&hellip;</p>
  </div>
  <div class="stats" id="stats" aria-label="Board statistics"></div>
</header>
<section class="model-strip" id="model-strip" aria-label="How the implied values are made"></section>
<nav class="controls" aria-label="Board controls">
  <div class="tabs" role="tablist">
    <button type="button" id="tab-board" class="tab active" role="tab">Pre-token board</button>
    <button type="button" id="tab-live" class="tab" role="tab">Already trading</button>
  </div>
  <label class="ctl grow">Search
    <input type="search" id="q" placeholder="Protocol or category&hellip;" autocomplete="off">
  </label>
  <label class="ctl">Category
    <select id="cat"></select>
  </label>
  <label class="ctl">Chain
    <select id="chain"></select>
  </label>
  <label class="ctl check">
    <input type="checkbox" id="watch"> Watchlist only
  </label>
  <span class="count" id="count"></span>
</nav>
<main id="view" tabindex="-1"></main>
<footer class="foot" id="foot"></footer>
<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
